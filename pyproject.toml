[project]
name = "fastkit"
version = "0.0.1"
description = "纯后端异步服务骨架(FastAPI + FastStream + RabbitMQ + PostgreSQL + Redis + dishka DI)"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "kaxiluo", email = "linyiyongcn@163.com" }]
keywords = ["fastapi", "faststream", "rabbitmq", "asyncio", "outbox", "skeleton"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: FastAPI",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.140,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.14,<3",
    "structlog>=26.1,<27",
    "dishka>=1.10,<2",
    "uvicorn[standard]>=0.51,<1",
    "httpx>=0.28,<1",
    "sqlalchemy[asyncio]>=2.0,<3",
    "asyncpg>=0.31,<1",
    "redis>=8.0,<9",
    "limits>=5.8,<6",
    "faststream[rabbit]>=0.7,<0.8",
    "alembic>=1.18,<2",
    "apscheduler>=3.11,<4",
]

[project.optional-dependencies]
mysql = [
    "asyncmy>=0.2.11,<1",
]

[project.urls]
Homepage = "https://github.com/kaxiluo/fastkit"
Repository = "https://github.com/kaxiluo/fastkit"
Issues = "https://github.com/kaxiluo/fastkit/issues"

[dependency-groups]
dev = [
    "ruff>=0.16,<1",
    "pytest>=9.1,<10",
    "pytest-asyncio>=1.4,<2",
    "asgi-lifespan>=2.1,<3",
    "import-linter>=2.13,<3",
    "respx>=0.23,<1",
    "pytest-cov>=7.0,<8",
]

[tool.ruff]
target-version = "py313"
line-length = 100
exclude = ["docs", "alembic/versions", "app/infrastructure/messaging/migrations"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
    "-ra",
    "--strict-config",
    "--strict-markers",
    "--import-mode=importlib",
    "--cov",
    "-m", "not integration and not contract and not e2e",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
markers = [
    "unit: 纯单元测试,不依赖外部基础设施",
    "integration: 与真实基础设施的集成测试",
    "contract: 外部接口契约测试",
    "e2e: 端到端业务链路测试",
]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "App layering"
type = "layers"
containers = ["app"]
layers = [
    "entrypoints",
    "bootstrap",
    "modules",
    "integrations",
    "infrastructure",
    "config",
    "shared",
]

# Module isolation (template — uncomment and fill in for each new module pair):
# [[tool.importlinter.contracts]]
# name = "Module isolation: example vs <other>"
# type = "forbidden"
# source_modules = ["app.modules.example"]
# forbidden_modules = ["app.modules.<other>"]
# ignore_imports = ["app.modules.<other>.public"]

[tool.coverage.run]
source = ["app"]
branch = true
omit = [
    "app/entrypoints/worker.py",
    "app/entrypoints/scheduler.py",
    "app/infrastructure/messaging/migrations/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
